<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Modern Glass Calculator</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          boxShadow: {
            'glow-accent': '0 0 25px -4px rgba(99, 102, 241, 0.45)',
            'glow-cyan': '0 0 25px -4px rgba(6, 182, 212, 0.35)',
            'glass': '0 25px 50px -12px rgba(0, 0, 0, 0.35)',
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar for expression & history */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.25);
      border-radius: 9999px;
    }

    /* Keypad button styles & tactile feedback */
    .calc-btn {
      touch-action: manipulation;
      transition: transform 0.12s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.15s ease, filter 0.12s ease;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
      overflow: hidden;
    }
    .calc-btn:active {
      transform: scale(0.93);
    }
    .btn-pressed {
      transform: scale(0.93) !important;
      filter: brightness(1.3) !important;
    }

    /* Ripple Effect */
    .ripple {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      animation: rippleEffect 0.45s linear;
      background-color: rgba(255, 255, 255, 0.3);
      pointer-events: none;
    }
    @keyframes rippleEffect {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    /* Glassmorphic theme surfaces */
    .surface-glass-dark {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.09);
    }
    .surface-glass-light {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    @keyframes toastFade {
      0% { opacity: 0; transform: translateY(-8px); }
      15% { opacity: 1; transform: translateY(0); }
      80% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-8px); }
    }
    .toast-anim {
      animation: toastFade 1.8s ease forwards;
    }
  </style>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-3 sm:p-5 font-sans transition-colors duration-300 relative overflow-x-hidden selection:bg-indigo-500 selection:text-white">

  <!-- Ambient light gradients -->
  <div class="fixed top-10 left-10 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none -z-10 animate-pulse" style="animation-duration: 9s;"></div>
  <div class="fixed bottom-10 right-10 w-96 h-96 bg-cyan-600/15 rounded-full blur-3xl pointer-events-none -z-10 animate-pulse" style="animation-duration: 11s;"></div>

  <!-- Notification Toast -->
  <div id="toast" class="fixed top-5 z-50 pointer-events-none opacity-0 transition-opacity">
    <div class="bg-indigo-600 text-white text-xs font-semibold tracking-wide px-4 py-2 rounded-full shadow-lg backdrop-blur-md flex items-center gap-2">
      <i data-lucide="info" class="w-3.5 h-3.5"></i>
      <span id="toast-text">Ready</span>
    </div>
  </div>

  <!-- Main Calculator Card Container -->
  <main class="w-full max-w-[420px] sm:max-w-[450px] transition-all duration-300">
    <div id="calc-card" class="surface-glass-dark rounded-3xl p-5 sm:p-6 shadow-glass relative overflow-hidden transition-all duration-300">
      
      <!-- Top header bar -->
      <header class="flex items-center justify-between pb-3.5 mb-3.5 border-b border-white/10 dark:border-white/10 border-slate-200">
        <div class="flex items-center gap-2">
          <!-- Mac-style status dots -->
          <div class="flex gap-1.5 mr-1">
            <span class="w-2.5 h-2.5 rounded-full bg-rose-500/80 inline-block"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-amber-500/80 inline-block"></span>
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500/80 inline-block"></span>
          </div>
          <span class="text-xs font-bold tracking-wider text-slate-300 uppercase">Aura Precision</span>
        </div>

        <!-- Utility controls -->
        <div class="flex items-center gap-1">
          <button id="sound-toggle-btn" title="Toggle audio feedback" class="p-2 rounded-xl text-slate-400 hover:text-indigo-400 hover:bg-white/5 active:scale-95 transition-all">
            <i id="sound-icon" data-lucide="volume-2" class="w-4 h-4"></i>
          </button>
          <button id="theme-toggle-btn" title="Toggle dark/light theme" class="p-2 rounded-xl text-slate-400 hover:text-amber-400 hover:bg-white/5 active:scale-95 transition-all">
            <i id="theme-icon" data-lucide="sun" class="w-4 h-4"></i>
          </button>
          <button id="history-toggle-btn" title="View calculation history" class="p-2 rounded-xl text-slate-400 hover:text-indigo-400 hover:bg-white/5 active:scale-95 transition-all">
            <i data-lucide="history" class="w-4 h-4"></i>
          </button>
        </div>
      </header>

      <section id="display-area" class="mb-4 px-4 py-3 rounded-2xl bg-slate-900/80 dark:bg-slate-950/70 border border-white/10 text-right flex flex-col justify-between min-h-[114px] cursor-pointer group transition-all" title="Click to copy result">
        <!-- Trace / Expression Line -->
        <div id="expression-display" class="font-mono text-xs sm:text-sm text-slate-400 overflow-x-auto whitespace-nowrap scrollbar-none h-6 flex items-center justify-end tracking-wider">
        </div>

        <!-- Evaluated Value -->
        <div class="flex items-baseline justify-end gap-1 mt-1 overflow-hidden">
          <div id="result-display" class="font-mono text-4xl sm:text-5xl font-semibold text-slate-50 tracking-tight overflow-x-auto whitespace-nowrap scrollbar-none transition-all duration-100">
            0
          </div>
        </div>

        <!-- Copy Feedback Hint -->
        <div class="flex items-center justify-between pt-1">
          <span class="text-[10px] font-mono text-slate-500 uppercase tracking-widest opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1">
            <i data-lucide="copy" class="w-3 h-3"></i> Tap to copy
          </span>
          <span id="active-op-indicator" class="text-[11px] font-mono font-bold text-indigo-400 tracking-wider"></span>
        </div>
      </section>

      <div class="grid grid-cols-4 gap-2 mb-2">
        <button data-action="square" class="calc-btn py-2.5 rounded-xl text-cyan-300 hover:text-white bg-cyan-950/30 hover:bg-cyan-900/50 font-mono text-sm font-semibold border border-cyan-500/20 shadow-sm flex items-center justify-center gap-0.5" title="Square (x²)">
          <span>x</span><span class="text-xs -mt-1 font-bold">2</span>
        </button>
        <button data-action="factorial" class="calc-btn py-2.5 rounded-xl text-cyan-300 hover:text-white bg-cyan-950/30 hover:bg-cyan-900/50 font-mono text-sm font-semibold border border-cyan-500/20 shadow-sm" title="Factorial (n!)">
          n!
        </button>
        <button data-action="log10" class="calc-btn py-2.5 rounded-xl text-cyan-300 hover:text-white bg-cyan-950/30 hover:bg-cyan-900/50 font-mono text-xs font-semibold border border-cyan-500/20 shadow-sm" title="Common Logarithm (log10)">
          log<span class="text-[9px] align-sub">10</span>
        </button>
        <button data-action="ln" class="calc-btn py-2.5 rounded-xl text-cyan-300 hover:text-white bg-cyan-950/30 hover:bg-cyan-900/50 font-mono text-xs font-semibold border border-cyan-500/20 shadow-sm" title="Natural Logarithm (ln)">
          ln
        </button>
      </div>

      <div id="keypad" class="grid grid-cols-4 gap-2">
        <!-- Row 1: Clear, Sign, Percent, Division -->
        <button data-action="clear" class="calc-btn py-3.5 rounded-2xl text-rose-400 hover:text-rose-300 bg-rose-500/10 hover:bg-rose-500/20 font-bold text-base border border-rose-500/20 shadow-sm">
          AC
        </button>
        <button data-action="sign" class="calc-btn py-3.5 rounded-2xl text-slate-300 hover:text-white bg-slate-800/50 hover:bg-slate-800/80 font-mono text-base border border-white/5" title="Sign flip (±)">
          ±
        </button>
        <button data-action="percent" class="calc-btn py-3.5 rounded-2xl text-slate-300 hover:text-white bg-slate-800/50 hover:bg-slate-800/80 font-mono text-base border border-white/5" title="Percentage (%)">
          %
        </button>
        <button data-action="op" data-val="/" class="calc-btn py-3.5 rounded-2xl text-indigo-400 hover:text-white bg-indigo-600/20 hover:bg-indigo-600/40 active:bg-indigo-600 font-semibold text-xl border border-indigo-500/30">
          ÷
        </button>

        <!-- Row 2: 7, 8, 9, Multiplication -->
        <button data-action="num" data-val="7" class="calc-btn py-3.5 rounded-2xl text-slate-100 hover:text-white bg-slate-800/40 hover:bg-slate-800/70 font-medium text-xl border border-white/5">
          7
        </button>
        <button data-action="num" data-val="8" class="calc-btn py-3.5 rounded-2xl text-slate-100 hover:text-white bg-slate-800/40 hover:bg-slate-800/70 font-medium text-xl border border-white/5">
          8
        </button>
        <button data-action="num" data-val="9" class="calc-btn py-3.5 rounded-2xl text-slate-100 hover:text-white bg-slate-800/40 hover:bg-slate-800/70 font-medium text-xl border border-white/5">
          9
        </button>
        <button data-action="op" data-val="*" class="calc-btn py-3.5 rounded-2xl text-indigo-400 hover:text-white bg-indigo-600/20 hover:bg-indigo-600/40 active:bg-indigo-600 font-semibold text-xl border border-indigo-500/30">
          ×
        </button>

        <!-- Row 3: 4, 5, 6, Subtraction -->
        <button data-action="num" data-val="4" class="calc-btn py-3.5 rounded-2xl text-slate-100 hover:text-white bg-slate-800/40 hover:bg-slate-800/70 font-medium text-xl border border-white/5">
          4
        </button>
        <button data-action="num" data-val="5" class="calc-btn py-3.5 rounded-2xl text-slate-100 hover:text-white bg-slate-800/40 hover:bg-slate-800/70 font-medium text-xl border border-white/5">
          5
        </button>
        <button data-action="num" data-val="6" class="calc-btn py-3.5 rounded-2xl text-slate-100 hover:text-white bg-slate-800/40 hover:bg-slate-800/70 font-medium text-xl border border-white/5">
          6
        </button>
        <button data-action="op" data-val="-" class="calc-btn py-3.5 rounded-2xl text-indigo-400 hover:text-white bg-indigo-600/20 hover:bg-indigo-600/40 active:bg-indigo-600 font-semibold text-xl border border-indigo-500/30">
          −
        </button>

        <!-- Row 4: 1, 2, 3, Addition -->
        <button data-action="num" data-val="1" class="calc-btn py-3.5 rounded-2xl text-slate-100 hover:text-white bg-slate-800/40 hover:bg-slate-800/70 font-medium text-xl border border-white/5">
          1
        </button>
        <button data-action="num" data-val="2" class="calc-btn py-3.5 rounded-2xl text-slate-100 hover:text-white bg-slate-800/40 hover:bg-slate-800/70 font-medium text-xl border border-white/5">
          2
        </button>
        <button data-action="num" data-val="3" class="calc-btn py-3.5 rounded-2xl text-slate-100 hover:text-white bg-slate-800/40 hover:bg-slate-800/70 font-medium text-xl border border-white/5">
          3
        </button>
        <button data-action="op" data-val="+" class="calc-btn py-3.5 rounded-2xl text-indigo-400 hover:text-white bg-indigo-600/20 hover:bg-indigo-600/40 active:bg-indigo-600 font-semibold text-xl border border-indigo-500/30">
          +
        </button>

        <!-- Row 5: Square Root, 0, Decimal, Backspace -->
        <button data-action="sqrt" class="calc-btn py-3.5 rounded-2xl text-cyan-300 hover:text-white bg-cyan-950/20 hover:bg-cyan-900/40 font-mono text-base border border-cyan-500/20" title="Square Root (√x)">
          √x
        </button>
        <button data-action="num" data-val="0" class="calc-btn py-3.5 rounded-2xl text-slate-100 hover:text-white bg-slate-800/40 hover:bg-slate-800/70 font-medium text-xl border border-white/5">
          0
        </button>
        <button data-action="dot" class="calc-btn py-3.5 rounded-2xl text-slate-300 hover:text-white bg-slate-800/40 hover:bg-slate-800/70 font-bold text-xl border border-white/5">
          .
        </button>
        <button data-action="backspace" class="calc-btn py-3.5 rounded-2xl text-slate-300 hover:text-rose-300 bg-slate-800/40 hover:bg-slate-800/70 font-medium text-base border border-white/5 flex items-center justify-center" title="Backspace">
          <i data-lucide="delete" class="w-4 h-4 pointer-events-none"></i>
        </button>

        <!-- Row 6: Wide Equal Button -->
        <div class="col-span-4 mt-0.5">
          <button data-action="equals" class="w-full calc-btn py-3.5 rounded-2xl text-white font-semibold text-xl bg-gradient-to-r from-indigo-500 via-indigo-600 to-purple-600 hover:from-indigo-400 hover:via-indigo-500 hover:to-purple-500 shadow-glow-accent border border-indigo-400/30 flex items-center justify-center tracking-wider">
            =
          </button>
        </div>
      </div>

      <div id="history-drawer" class="absolute inset-0 bg-slate-900/95 dark:bg-slate-900/95 backdrop-blur-2xl z-20 transform translate-x-full transition-transform duration-300 ease-in-out p-5 flex flex-col rounded-3xl">
        <div class="flex items-center justify-between pb-3 border-b border-white/10 mb-3">
          <div class="flex items-center gap-2 text-slate-200 font-semibold text-sm">
            <i data-lucide="history" class="w-4 h-4 text-indigo-400"></i>
            <span>Calculation History</span>
          </div>
          <div class="flex items-center gap-1.5">
            <button id="clear-history-btn" title="Clear history" class="p-1.5 rounded-lg text-slate-400 hover:text-rose-400 hover:bg-white/5 active:scale-95 transition-all text-xs flex items-center gap-1">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              <span>Clear</span>
            </button>
            <button id="close-history-btn" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-white/5 active:scale-95 transition-all">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <div id="history-list" class="flex-1 overflow-y-auto space-y-2 pr-1 text-right">
        </div>

        <div class="pt-3 border-t border-white/10 text-center">
          <p class="text-[11px] text-slate-400 font-mono">Tap any entry to restore value</p>
        </div>
      </div>

    </div>

    <!-- Keyboard guide footer -->
    <footer class="mt-3.5 text-center px-2">
      <p class="text-[11px] sm:text-xs text-slate-400 font-mono flex flex-wrap items-center justify-center gap-x-3 gap-y-1">
        <span>Digits: <b class="text-slate-300 font-normal">0-9</b></span>
        <span>Ops: <b class="text-slate-300 font-normal">+ − * /</b></span>
        <span>Adv: <b class="text-slate-300 font-normal">! (fac), ^ (sq), l (log)</b></span>
        <span>Eval: <b class="text-slate-300 font-normal">Enter</b></span>
        <span>Clear: <b class="text-slate-300 font-normal">Esc</b></span>
      </p>
    </footer>
  </main>

  <script>
    // State Container
    const state = {
      displayValue: '0',
      previousValue: null,
      operation: null,
      waitingForOperand: false,
      isEvaluated: false,
      expressionTrace: '',
      soundEnabled: true,
      history: []
    };

    // Web Audio Synthesizer Micro-Engine
    let audioCtx = null;
    function playTone(type = 'click') {
      if (!state.soundEnabled) return;
      try {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(500, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.04);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.start(now);
          osc.stop(now + 0.04);
        } else if (type === 'special') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(780, now + 0.08);
          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'eval') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.04);
          osc.frequency.setValueAtTime(783.99, now + 0.08);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.start(now);
          osc.stop(now + 0.18);
        } else if (type === 'error') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(160, now);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        }
      } catch (err) {
        console.warn('Audio tone err:', err);
      }
    }

    const resultDisplay = document.getElementById('result-display');
    const expressionDisplay = document.getElementById('expression-display');
    const activeOpIndicator = document.getElementById('active-op-indicator');
    const displayArea = document.getElementById('display-area');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toast-text');
    const calcCard = document.getElementById('calc-card');

    const soundToggleBtn = document.getElementById('sound-toggle-btn');
    const soundIcon = document.getElementById('sound-icon');
    const themeToggleBtn = document.getElementById('theme-toggle-btn');
    const themeIcon = document.getElementById('theme-icon');

    const historyDrawer = document.getElementById('history-drawer');
    const historyList = document.getElementById('history-list');
    const historyToggleBtn = document.getElementById('history-toggle-btn');
    const closeHistoryBtn = document.getElementById('close-history-btn');
    const clearHistoryBtn = document.getElementById('clear-history-btn');

    function formatNumberForDisplay(numStr) {
      if (['Error', 'Cannot divide by 0', 'Domain Error', 'Overflow', 'NaN', 'Infinity'].includes(numStr)) {
        return numStr;
      }
      if (!numStr) return '0';
      if (numStr.includes('e') || numStr.includes('E')) return numStr;

      const parts = numStr.split('.');
      const intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      return parts[1] !== undefined ? `${intPart}.${parts[1]}` : intPart;
    }

    function updateDisplay() {
      const len = state.displayValue.length;
      if (len > 14) {
        resultDisplay.className = 'font-mono text-2xl sm:text-3xl font-semibold text-slate-50 tracking-tight overflow-x-auto whitespace-nowrap scrollbar-none transition-all';
      } else if (len > 9) {
        resultDisplay.className = 'font-mono text-3xl sm:text-4xl font-semibold text-slate-50 tracking-tight overflow-x-auto whitespace-nowrap scrollbar-none transition-all';
      } else {
        resultDisplay.className = 'font-mono text-4xl sm:text-5xl font-semibold text-slate-50 tracking-tight overflow-x-auto whitespace-nowrap scrollbar-none transition-all';
      }

      resultDisplay.textContent = formatNumberForDisplay(state.displayValue);
      expressionDisplay.textContent = state.expressionTrace;

      const opSymbolMap = { '+': '+', '-': '−', '*': '×', '/': '÷' };
      activeOpIndicator.textContent = state.operation ? (opSymbolMap[state.operation] || state.operation) : '';
    }

    function showToast(msg) {
      toastText.textContent = msg;
      toast.classList.remove('opacity-0', 'toast-anim');
      void toast.offsetWidth;
      toast.classList.add('toast-anim');
    }

    function calculate(first, second, op) {
      const a = parseFloat(first);
      const b = parseFloat(second);

      if (isNaN(a) || isNaN(b)) return b;

      switch (op) {
        case '+': return a + b;
        case '-': return a - b;
        case '*': return a * b;
        case '/':
          if (b === 0) return 'Cannot divide by 0';
          return a / b;
        default:
          return b;
      }
    }

    function inputDigit(digit) {
      playTone('click');
      if (state.isEvaluated || ['Error', 'Cannot divide by 0', 'Domain Error', 'Overflow'].includes(state.displayValue)) {
        state.displayValue = digit;
        state.previousValue = null;
        state.operation = null;
        state.expressionTrace = '';
        state.isEvaluated = false;
        state.waitingForOperand = false;
        updateDisplay();
        return;
      }

      if (state.waitingForOperand) {
        state.displayValue = digit;
        state.waitingForOperand = false;
      } else {
        if (state.displayValue === '0') {
          state.displayValue = digit;
        } else if (state.displayValue.length < 16) {
          state.displayValue += digit;
        }
      }
      updateDisplay();
    }

    function inputDecimal() {
      playTone('click');
      if (state.isEvaluated) {
        state.displayValue = '0.';
        state.previousValue = null;
        state.operation = null;
        state.expressionTrace = '';
        state.isEvaluated = false;
        state.waitingForOperand = false;
        updateDisplay();
        return;
      }

      if (state.waitingForOperand) {
        state.displayValue = '0.';
        state.waitingForOperand = false;
        updateDisplay();
        return;
      }

      if (!state.displayValue.includes('.')) {
        state.displayValue += '.';
        updateDisplay();
      }
    }

    function handleOperator(nextOp) {
      playTone('click');
      const opSymbolMap = { '+': '+', '-': '−', '*': '×', '/': '÷' };
      const displayOp = opSymbolMap[nextOp] || nextOp;

      if (['Error', 'Cannot divide by 0', 'Domain Error', 'Overflow'].includes(state.displayValue)) {
        clearAll();
        return;
      }

      const inputValue = parseFloat(state.displayValue);

      if (state.previousValue === null) {
        state.previousValue = inputValue;
      } else if (state.operation && !state.waitingForOperand) {
        const result = calculate(state.previousValue, inputValue, state.operation);
        if (typeof result === 'string') {
          handleError(result);
          return;
        }
        state.displayValue = String(parseFloat(result.toPrecision(12)));
        state.previousValue = result;
      }

      state.waitingForOperand = true;
      state.operation = nextOp;
      state.isEvaluated = false;
      state.expressionTrace = `${formatNumberForDisplay(String(state.previousValue))} ${displayOp}`;
      updateDisplay();
    }

    function evaluate() {
      if (['Error', 'Cannot divide by 0', 'Domain Error', 'Overflow'].includes(state.displayValue)) {
        clearAll();
        return;
      }

      if (state.operation === null || state.previousValue === null) {
        return;
      }

      const opSymbolMap = { '+': '+', '-': '−', '*': '×', '/': '÷' };
      const currentVal = parseFloat(state.displayValue);
      const prevVal = state.previousValue;
      const op = state.operation;
      const displayOp = opSymbolMap[op] || op;

      const calcResult = calculate(prevVal, currentVal, op);

      if (typeof calcResult === 'string') {
        handleError(calcResult);
        return;
      }

      const rounded = parseFloat(calcResult.toPrecision(12));
      const resStr = String(rounded);
      const expressionFull = `${formatNumberForDisplay(String(prevVal))} ${displayOp} ${formatNumberForDisplay(String(currentVal))}`;

      playTone('eval');
      addHistory(expressionFull, resStr);

      state.expressionTrace = `${expressionFull} =`;
      state.displayValue = resStr;
      state.previousValue = rounded;
      state.operation = null;
      state.waitingForOperand = true;
      state.isEvaluated = true;
      updateDisplay();
    }

    function handleSquare() {
      playTone('special');
      const val = parseFloat(state.displayValue);
      if (isNaN(val)) return;

      const res = val * val;
      const resStr = String(parseFloat(res.toPrecision(12)));
      addHistory(`sqr(${formatNumberForDisplay(String(val))})`, resStr);

      state.expressionTrace = `(${formatNumberForDisplay(String(val))})² =`;
      state.displayValue = resStr;
      state.waitingForOperand = true;
      state.isEvaluated = true;
      updateDisplay();
    }

    function handleFactorial() {
      playTone('special');
      const val = parseFloat(state.displayValue);
      if (isNaN(val)) return;

      if (val < 0 || !Number.isInteger(val)) {
        handleError('Domain Error');
        return;
      }
      if (val > 170) {
        handleError('Overflow');
        return;
      }

      let result = 1;
      for (let i = 2; i <= val; i++) {
        result *= i;
      }

      const resStr = String(result);
      addHistory(`${formatNumberForDisplay(String(val))}!`, resStr);

      state.expressionTrace = `${formatNumberForDisplay(String(val))}! =`;
      state.displayValue = resStr;
      state.waitingForOperand = true;
      state.isEvaluated = true;
      updateDisplay();
    }

    function handleLog10() {
      playTone('special');
      const val = parseFloat(state.displayValue);
      if (isNaN(val)) return;

      if (val <= 0) {
        handleError('Domain Error');
        return;
      }

      const res = parseFloat(Math.log10(val).toPrecision(12));
      const resStr = String(res);
      addHistory(`log₁₀(${formatNumberForDisplay(String(val))})`, resStr);

      state.expressionTrace = `log₁₀(${formatNumberForDisplay(String(val))}) =`;
      state.displayValue = resStr;
      state.waitingForOperand = true;
      state.isEvaluated = true;
      updateDisplay();
    }

    function handleLn() {
      playTone('special');
      const val = parseFloat(state.displayValue);
      if (isNaN(val)) return;

      if (val <= 0) {
        handleError('Domain Error');
        return;
      }

      const res = parseFloat(Math.log(val).toPrecision(12));
      const resStr = String(res);
      addHistory(`ln(${formatNumberForDisplay(String(val))})`, resStr);

      state.expressionTrace = `ln(${formatNumberForDisplay(String(val))}) =`;
      state.displayValue = resStr;
      state.waitingForOperand = true;
      state.isEvaluated = true;
      updateDisplay();
    }

    function handleSquareRoot() {
      playTone('special');
      const val = parseFloat(state.displayValue);
      if (isNaN(val)) return;

      if (val < 0) {
        handleError('Domain Error');
        return;
      }

      const res = parseFloat(Math.sqrt(val).toPrecision(12));
      const resStr = String(res);
      addHistory(`√(${formatNumberForDisplay(String(val))})`, resStr);

      state.expressionTrace = `√(${formatNumberForDisplay(String(val))}) =`;
      state.displayValue = resStr;
      state.waitingForOperand = true;
      state.isEvaluated = true;
      updateDisplay();
    }

    function handlePercentage() {
      playTone('special');
      const val = parseFloat(state.displayValue);
      if (isNaN(val)) return;

      let res;
      let expr;
      if (state.previousValue !== null && state.operation) {
        res = (state.previousValue * val) / 100;
        expr = `${state.previousValue} × ${val}%`;
      } else {
        res = val / 100;
        expr = `${val}%`;
      }

      res = parseFloat(res.toPrecision(12));
      const resStr = String(res);
      addHistory(expr, resStr);

      state.displayValue = resStr;
      state.waitingForOperand = false;
      updateDisplay();
    }

    function toggleSign() {
      playTone('click');
      if (state.displayValue === '0' || ['Error', 'Cannot divide by 0'].includes(state.displayValue)) return;
      if (state.displayValue.startsWith('-')) {
        state.displayValue = state.displayValue.slice(1);
      } else {
        state.displayValue = '-' + state.displayValue;
      }
      updateDisplay();
    }

    function deleteLastChar() {
      playTone('click');
      if (state.waitingForOperand || ['Error', 'Cannot divide by 0', 'Domain Error', 'Overflow'].includes(state.displayValue)) {
        state.displayValue = '0';
        updateDisplay();
        return;
      }
      if (state.displayValue.length > 1) {
        state.displayValue = state.displayValue.slice(0, -1);
      } else {
        state.displayValue = '0';
      }
      updateDisplay();
    }

    function clearAll() {
      playTone('click');
      state.displayValue = '0';
      state.previousValue = null;
      state.operation = null;
      state.waitingForOperand = false;
      state.isEvaluated = false;
      state.expressionTrace = '';
      updateDisplay();
    }

    function handleError(msg) {
      playTone('error');
      state.displayValue = msg;
      state.expressionTrace = '';
      state.previousValue = null;
      state.operation = null;
      state.waitingForOperand = true;
      state.isEvaluated = true;
      updateDisplay();
    }

    function addHistory(expr, result) {
      state.history.unshift({ expr, result, id: Date.now() });
      if (state.history.length > 50) state.history.pop();
      renderHistory();
    }

    function renderHistory() {
      if (state.history.length === 0) {
        historyList.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-slate-500 py-16">
            <i data-lucide="inbox" class="w-8 h-8 stroke-[1.5] mb-2 opacity-50"></i>
            <p class="text-xs">No previous calculations</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      historyList.innerHTML = state.history.map(item => `
        <div data-val="${item.result}" class="history-item p-2.5 rounded-xl bg-slate-800/40 hover:bg-indigo-600/20 border border-white/5 cursor-pointer transition-colors group">
          <div class="text-[11px] text-slate-400 group-hover:text-indigo-300 font-mono truncate">${item.expr}</div>
          <div class="text-base font-semibold text-slate-100 group-hover:text-white font-mono mt-0.5 truncate">${formatNumberForDisplay(item.result)}</div>
        </div>
      `).join('');

      document.querySelectorAll('.history-item').forEach(el => {
        el.addEventListener('click', () => {
          const val = el.getAttribute('data-val');
          state.displayValue = val;
          state.waitingForOperand = true;
          state.isEvaluated = true;
          updateDisplay();
          playTone('click');
          showToast(`Restored: ${val}`);
          historyDrawer.classList.add('translate-x-full');
        });
      });
    }

    function createRipple(event, button) {
      const circle = document.createElement('span');
      const diameter = Math.max(button.clientWidth, button.clientHeight);
      const radius = diameter / 2;
      const rect = button.getBoundingClientRect();

      circle.style.width = circle.style.height = `${diameter}px`;
      circle.style.left = `${(event.clientX || rect.left + radius) - rect.left - radius}px`;
      circle.style.top = `${(event.clientY || rect.top + radius) - rect.top - radius}px`;
      circle.classList.add('ripple');

      const existingRipple = button.getElementsByClassName('ripple')[0];
      if (existingRipple) {
        existingRipple.remove();
      }
      button.appendChild(circle);
    }

    displayArea.addEventListener('click', () => {
      if (['Error', 'Cannot divide by 0', 'Domain Error', 'Overflow'].includes(state.displayValue)) return;
      const textToCopy = state.displayValue;
      const tempInput = document.createElement('textarea');
      tempInput.value = textToCopy;
      tempInput.style.position = 'fixed';
      tempInput.style.opacity = '0';
      document.body.appendChild(tempInput);
      tempInput.select();

      try {
        document.execCommand('copy');
        playTone('click');
        showToast(`Copied: ${formatNumberForDisplay(textToCopy)}`);
      } catch (err) {
        console.error('Copy failed:', err);
      } finally {
        document.body.removeChild(tempInput);
      }
    });

    function triggerVisualPress(selector) {
      const btn = document.querySelector(selector);
      if (btn) {
        btn.classList.add('btn-pressed');
        setTimeout(() => btn.classList.remove('btn-pressed'), 120);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

      if (e.key >= '0' && e.key <= '9') {
        inputDigit(e.key);
        triggerVisualPress(`button[data-val="${e.key}"]`);
      } else if (e.key === '.') {
        inputDecimal();
        triggerVisualPress(`button[data-action="dot"]`);
      } else if (['+', '-', '*', '/'].includes(e.key)) {
        handleOperator(e.key);
        triggerVisualPress(`button[data-val="${e.key}"]`);
      } else if (e.key === '%') {
        handlePercentage();
        triggerVisualPress(`button[data-action="percent"]`);
      } else if (e.key === '!') {
        handleFactorial();
        triggerVisualPress(`button[data-action="factorial"]`);
      } else if (e.key === '^') {
        handleSquare();
        triggerVisualPress(`button[data-action="square"]`);
      } else if (e.key.toLowerCase() === 'l') {
        handleLog10();
        triggerVisualPress(`button[data-action="log10"]`);
      } else if (e.key.toLowerCase() === 'n') {
        handleLn();
        triggerVisualPress(`button[data-action="ln"]`);
      } else if (e.key === 'Enter' || e.key === '=') {
        e.preventDefault();
        evaluate();
        triggerVisualPress(`button[data-action="equals"]`);
      } else if (e.key === 'Backspace') {
        deleteLastChar();
        triggerVisualPress(`button[data-action="backspace"]`);
      } else if (e.key === 'Escape' || e.key.toLowerCase() === 'c') {
        clearAll();
        triggerVisualPress(`button[data-action="clear"]`);
      }
    });

    document.body.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;

      createRipple(e, btn);

      const action = btn.getAttribute('data-action');
      const val = btn.getAttribute('data-val');

      if (action === 'num') inputDigit(val);
      else if (action === 'dot') inputDecimal();
      else if (action === 'op') handleOperator(val);
      else if (action === 'equals') evaluate();
      else if (action === 'clear') clearAll();
      else if (action === 'backspace') deleteLastChar();
      else if (action === 'sign') toggleSign();
      else if (action === 'sqrt') handleSquareRoot();
      else if (action === 'percent') handlePercentage();
      else if (action === 'square') handleSquare();
      else if (action === 'factorial') handleFactorial();
      else if (action === 'log10') handleLog10();
      else if (action === 'ln') handleLn();
    });

    // History drawer controls
    historyToggleBtn.addEventListener('click', () => {
      playTone('click');
      historyDrawer.classList.toggle('translate-x-full');
    });

    closeHistoryBtn.addEventListener('click', () => {
      playTone('click');
      historyDrawer.classList.add('translate-x-full');
    });

    clearHistoryBtn.addEventListener('click', () => {
      playTone('click');
      state.history = [];
      renderHistory();
      showToast('History cleared');
    });

    // Sound toggle
    soundToggleBtn.addEventListener('click', () => {
      state.soundEnabled = !state.soundEnabled;
      soundIcon.setAttribute('data-lucide', state.soundEnabled ? 'volume-2' : 'volume-x');
      soundToggleBtn.classList.toggle('text-indigo-400', state.soundEnabled);
      lucide.createIcons();
      showToast(state.soundEnabled ? 'Sound Enabled' : 'Muted');
    });

    // Dark / Light Theme Toggle
    themeToggleBtn.addEventListener('click', () => {
      const htmlEl = document.documentElement;
      const body = document.body;

      if (htmlEl.classList.contains('dark')) {
        htmlEl.classList.remove('dark');
        calcCard.classList.remove('surface-glass-dark');
        calcCard.classList.add('surface-glass-light');
        body.classList.remove('bg-slate-950', 'text-slate-100');
        body.classList.add('bg-slate-100', 'text-slate-800');
        themeIcon.setAttribute('data-lucide', 'moon');
      } else {
        htmlEl.classList.add('dark');
        calcCard.classList.remove('surface-glass-light');
        calcCard.classList.add('surface-glass-dark');
        body.classList.remove('bg-slate-100', 'text-slate-800');
        body.classList.add('bg-slate-950', 'text-slate-100');
        themeIcon.setAttribute('data-lucide', 'sun');
      }
      playTone('click');
      lucide.createIcons();
    });

    // Initialize application on load
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      renderHistory();
      updateDisplay();
    });
  </script>
</body>
</html>
